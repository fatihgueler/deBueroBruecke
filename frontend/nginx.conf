server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA – alle Routen zu index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Proxy zum Backend
    # resolver + Variable erzwingen eine Neuauflösung des Hostnamens bei jeder
    # Anfrage (statt der nginx-üblichen einmaligen Auflösung beim Start), damit
    # wir nach einem Redeploy des Backends (= neue interne IP) nicht auf eine
    # veraltete, tote IP zeigen und Requests endlos hängen.
    #
    # __DNS_RESOLVER__ wird beim Container-Start durch resolve-dns.sh (läuft
    # automatisch über /docker-entrypoint.d/) mit dem tatsächlichen Resolver
    # aus /etc/resolv.conf ersetzt – eine feste IP wie 127.0.0.11 existiert in
    # Railways Netzwerk nicht ("Connection refused").
    resolver __DNS_RESOLVER__ valid=10s;
    location /api/ {
        set $backend_upstream "backend:8000";
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Static-Assets mit Cache
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security Headers
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
